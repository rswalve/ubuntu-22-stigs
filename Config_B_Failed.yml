  ##########################
  # Ubuntu 24.04 Additional STIGs
  ##########################
  rUbuntu24AdditionalStigsComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: Ubuntu-24-Additional-IDCS-STIGs
      Platform: Linux
      Version: 1.0.1
      Description: Custom STIG remediations for Ubuntu 24.04 under IDCS cloud
      SupportedOsVersions:
        - "Ubuntu 24.04"
      Data: |
        name: Ubuntu24AdditionalSTIGs
        description: Custom STIG remediations for Ubuntu 24.04 under IDCS cloud
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: UpdatePackageDatabase
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "=== Updating Package Database ==="
                      export DEBIAN_FRONTEND=noninteractive
                      
                      # Update package lists with retries
                      for i in {1..3}; do
                        if apt-get update; then
                          echo "Package database updated successfully"
                          break
                        else
                          echo "Attempt $i failed, retrying in 10 seconds..."
                          sleep 10
                        fi
                      done

              - name: InstallSecurityTools
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "=== Installing Security Tools ==="
                      export DEBIAN_FRONTEND=noninteractive
                      
                      # Install essential security tools
                      apt-get -y install \
                        unattended-upgrades \
                        apt-listchanges \
                        needrestart \
                        aide \
                        rkhunter \
                        chkrootkit \
                        lynis \
                        fail2ban \
                        ufw \
                        apparmor \
                        apparmor-utils \
                        apparmor-profiles \
                        auditd \
                        libpam-pwquality \
                        acct \
                        sysstat \
                        logwatch \
                        logrotate \
                        rsyslog \
                        chrony \
                        vlock \
                        libpam-pkcs11 \
                        opensc-pkcs11 \
                        kdump-tools \
                        audispd-plugins \
                        openssh-client \
                        openssh-server \
                        2>> /tmp/security_tool_errors.log || true

                        echo "All security tools installed"
              - name: UpgradeAllPackages
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "=== Upgrading All Packages to Latest Versions ==="
                      export DEBIAN_FRONTEND=noninteractive
                      
                      # Full system upgrade to address all CVEs
                      apt-get -y dist-upgrade
                      
                      # Install security updates specifically
                      apt-get -y install --only-upgrade \
                        libc6 libc6-dev \
                        libssl3 libssl-dev \
                        openssl \
                        curl libcurl4 \
                        wget \
                        gnupg \
                        ca-certificates \
                        systemd \
                        openssh-client \
                        openssh-server \
                        sudo \
                        coreutils \
                        util-linux \
                        mount \
                        e2fsprogs \
                        bash \
                        python3 \
                        perl \
                        git \
                        vim \
                        2>> /tmp/upgrade_errors.log || true
                      
                      echo "All packages upgraded to latest versions"

              - name: V-270675-grub-boot-to-single-user
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      # 1. Generate Hash
                      PASSWORD="super-secret-ninja-password"
                      GRUB_HASH=$(echo -e "$PASSWORD\n$PASSWORD" | grub-mkpasswd-pbkdf2 | grep -oP '(?<=PBKDF2 hash of your password is ).*' )

                      # 2. Add to 40_custom (Standard way)
                      cat <<EOF >> /etc/grub.d/40_custom
                      set superusers="root"
                      password_pbkdf2 root $GRUB_HASH
                      EOF

                      # 3. Enable unrestricted boot (So it doesn't ask for password on normal boot)
                      # We target the specific menuentry generation line
                      sed -i 's/CLASS="--class gnu-linux/CLASS="--unrestricted --class gnu-linux/' /etc/grub.d/10_linux

                      # 4. CRITICAL: Ensure FIPS stays in the loop
                      # Instead of just update-grub, make sure the fips config is present
                      if [ -f /etc/default/grub.d/99-fips.cfg ]; then
                          echo "FIPS config detected, ensuring it is included..."
                      fi
                      
                      update-grub

                      # 5. STIG Requirement for permissions
                      # Use 400 or 600, but ensure the directory is also accessible
                      chmod 600 /boot/grub/grub.cfg
              - name: V-270691-DoD-Banner
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      tee /etc/issue.net > /dev/null << EOF
                      You are accessing a U.S. Government (USG) Information System (IS) that is
                      provided for USG-authorized use only. By using this IS (which includes any
                      device attached to this IS), you consent to the following conditions:
                      -The USG routinely intercepts and monitors communications on this IS for
                      purposes including, but not limited to, penetration testing, COMSEC monitoring,
                      network operations and defense, personnel misconduct (PM), law enforcement
                      (LE), and counterintelligence (CI) investigations.
                      -At any time, the USG may inspect and seize data stored on this IS.
                      -Communications using, or data stored on, this IS are not private, are subject
                      to routine monitoring, interception, and search, and may be disclosed or used
                      for any USG-authorized purpose.
                      -This IS includes security measures (e.g., authentication and access controls)
                      to protect USG interests--not for your personal benefit or privacy.
                      -Notwithstanding the above, using this IS does not constitute consent to PM, LE
                      or CI investigative searching or monitoring of the content of privileged
                      communications, or work product, related to personal representation or services
                      by attorneys, psychotherapists, or clergy, and their assistants. Such
                      communications and work product are private and confidential. See User
                      Agreement for details.
                      EOF
                      sed -i '/^Banner/d' /etc/ssh/sshd_config
                      sed -i '$aBanner /etc/issue.net' /etc/ssh/sshd_config
              - name: V-270652-SilentReports_in_Aide
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      sed 's/^#SILENTREPORTS=no/SILENTREPORTS=no/' /etc/default/aide
                      sed -i 's/^#\(SILENTREPORTS=no\)/\1/' /etc/default/aide
                      sed 's/^#SILENTREPORTS=no/SILENTREPORTS=no/' /etc/default/aide
              - name: ProEnableFIPS-ForceInitrd
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "=== FIPS Enablement: Disabling Initrdless Boot ==="
                      
                      # 1. Set Serial Console Password
                      echo "ubuntu:STIGdebug2024!" | chpasswd
                      
                      # 2. DISABLE 'initrdless' boot (CRITICAL for FIPS)
                      # We must remove the Force PartUUID setting so it uses our new initramfs
                      rm -f /etc/default/grub.d/40-force-partuuid.cfg
                      sed -i '/GRUB_FORCE_PARTUUID/d' /etc/default/grub
                      
                      # 3. Install AWS modules
                      apt-get update
                      apt-get install -y linux-modules-extra-aws
                      
                      # 4. Enable FIPS
                      pro enable fips-updates --assume-yes
                      
                      # Re-install/Update SSM Agent to ensure FIPS-compliant version
                      snap restart amazon-ssm-agent
                      
                      # Wait a moment for SSM to phone home before finishing the script
                      sleep 30
                      
                      # 5. Identify the FIPS kernel
                      FIPS_KERNEL=$(ls /lib/modules | grep fips | head -n 1)
                      echo "Targeting FIPS Kernel: $FIPS_KERNEL"

                      # 6. Force FIPS mode and ensure standard boot process
                      sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="/GRUB_CMDLINE_LINUX_DEFAULT="fips=1 /' /etc/default/grub
                      echo "GRUB_DISABLE_SUBMENU=y" >> /etc/default/grub
                      echo "GRUB_DEFAULT=0" >> /etc/default/grub
                      
                      # 7. Rebuild initramfs with Nitro drivers
                      echo "ena" >> /etc/initramfs-tools/modules
                      echo "nvme" >> /etc/initramfs-tools/modules
                      update-initramfs -u -k "$FIPS_KERNEL"
                      update-grub
                      
                      echo "Initrdless boot disabled. FIPS ready. Rebooting..."
              - name: RebootAfterFIPS
                action: Reboot
                inputs:
                  delaySeconds: 0 

              - name: V-270667-668-670-671-Ciphers_and_MACs
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "--- Starting SSH Hardening ---"

                      # Remove existing configs
                      rm -f /etc/ssh/ssh_config.d/*.conf /etc/ssh/sshd_config.d/*.conf
                      rm -f /etc/ssh/*.bak /etc/ssh/*.backup /etc/ssh/*~

                      # 2. SSH Daemon (sshd_config)
                      sed -i '/^#\?[[:space:]]*Ciphers/d' /etc/ssh/sshd_config
                      sed -i '/^#\?[[:space:]]*MACs/d' /etc/ssh/sshd_config

                      echo "Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr" >> /etc/ssh/sshd_config
                      echo "MACs hmac-sha2-512,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-256-etm@openssh.com" >> /etc/ssh/sshd_config

                      # 3. SSH Client (ssh_config)
                      sed -i '/^#\?[[:space:]]*Ciphers/d' /etc/ssh/ssh_config
                      sed -i '/^#\?[[:space:]]*MACs/d' /etc/ssh/ssh_config
                      sed -i '/^Host \*/d' /etc/ssh/ssh_config

                      echo "Host *" >> /etc/ssh/ssh_config
                      echo "    Ciphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr" >> /etc/ssh/ssh_config
                      echo "    MACs hmac-sha2-512,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-256-etm@openssh.com" >> /etc/ssh/ssh_config

                      # 4. Final Verification
                      echo "Verifying configuration..."
                      if sshd -t 2>&1; then
                          echo "Success: Configuration is valid. Restarting service."
                          systemctl restart ssh
                      else
                          echo "FATAL: SSH configuration error detected!" >&2
                          sshd -t 2>&1
                          exit 1
                      fi

                      # 5. Final Cleanup
                      rm -f /etc/ssh/*.bak /etc/ssh/*.backup
              
          
          - name: validate
            steps:
              - name: ValidateAppliedRemediations
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      echo "=== Validating Remediations ==="

                      echo "Done."
